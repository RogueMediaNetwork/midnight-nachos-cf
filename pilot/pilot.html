<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>That Mike Hamilton vs. The Future — EP1 pilot</title>
<style>
  html,body{margin:0;padding:0;background:#111;overflow:hidden}
  svg{display:block}
  text{font-family:"DejaVu Sans"; font-weight:bold}
</style>
</head>
<body>
<svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#1c1408" flood-opacity="0.30"/>
    </filter>
    <filter id="dsBig" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#1c1408" flood-opacity="0.35"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0.5 0"/>
    </filter>
    <radialGradient id="vig" cx="50%" cy="46%" r="75%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a1206" stop-opacity="0.34"/>
    </radialGradient>
  </defs>
  <g id="world"></g>
  <g id="overlay"></g>
  <rect id="grainR" x="0" y="0" width="1080" height="1920" filter="url(#grain)" opacity="0.055" pointer-events="none"/>
  <rect x="0" y="0" width="1080" height="1920" fill="url(#vig)" pointer-events="none"/>
</svg>
<script>
"use strict";
/* ============ palette ============ */
const C = {
  cream:"#f2ead6", cream2:"#e9dec2", navy:"#2c3d5c", wall:"#40608f", wall2:"#3a5680",
  hallway:"#3c5a86", floor:"#8a6748", floor2:"#7a5a3e", desk:"#96714e", deskTop:"#a8825c",
  black:"#26282e", denim:"#4f6fa8", skin:"#e8b98a", beard:"#3a3632",
  bot:"#ece5d2", botEdge:"#c9bfa4", screen:"#1f2b3a", led:"#7fe3a0",
  red:"#c8503c", yellow:"#e9b23f", green:"#5cab6b", white:"#faf6ea",
  tie:"#4f6fa8", paperInk:"#2c3d5c"
};
const SVGNS="http://www.w3.org/2000/svg";
const stage=document.getElementById("stage");
const world=document.getElementById("world");
const overlay=document.getElementById("overlay");

/* ============ helpers ============ */
function el(n,attrs,parent){const e=document.createElementNS(SVGNS,n);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||world).appendChild(e);return e;}
function grp(parent,tr){const g=el("g",tr?{transform:tr}:{},parent);return g;}
function rect(p,x,y,w,h,f,r,extra){const a={x:x,y:y,width:w,height:h,fill:f,rx:r==null?8:r};if(extra)Object.assign(a,extra);return el("rect",a,p);}
function circ(p,cx,cy,r,f,extra){const a={cx:cx,cy:cy,r:r,fill:f};if(extra)Object.assign(a,extra);return el("circle",a,p);}
function path(p,d,f,extra){const a={d:d,fill:f};if(extra)Object.assign(a,extra);return el("path",a,p);}
function poly(p,pts,f,extra){const a={points:pts,fill:f};if(extra)Object.assign(a,extra);return el("polygon",a,p);}
function line(p,x1,y1,x2,y2,stroke,w,extra){const a={x1:x1,y1:y1,x2:x2,y2:y2,stroke:stroke,"stroke-width":w||4,"stroke-linecap":"round"};if(extra)Object.assign(a,extra);return el("line",a,p);}
function T(p,x,y,str,size,fill,o){o=o||{};const t=el("text",{x:x,y:y,"font-size":size,fill:fill||C.paperInk,"text-anchor":o.anchor||"middle","letter-spacing":o.ls==null?1.5:o.ls},p);if(o.rot)t.setAttribute("transform","rotate("+o.rot+" "+x+" "+y+")");t.textContent=str;return t;}
// paper piece: fill + subtle edge stroke
function paper(p,x,y,w,h,f,r,rot){const e=rect(p,x,y,w,h,f,r==null?10:r,{stroke:"rgba(30,20,5,0.15)","stroke-width":3});if(rot)e.setAttribute("transform","rotate("+rot+" "+(x+w/2)+" "+(y+h/2)+")");return e;}
const lerp=(a,b,p)=>a+(b-a)*p;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eo=p=>1-Math.pow(1-clamp(p,0,1),2.4);
const eio=p=>{p=clamp(p,0,1);return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;};
const eoB=p=>{p=clamp(p,0,1);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
const q=(t,fps)=>Math.floor(t*(fps||10))/(fps||10); // stiff paper motion
function TR(g,x,y,rot,sc){g.setAttribute("transform","translate("+x+" "+y+")"+(rot?" rotate("+rot+")":"")+(sc!=null&&sc!==1?" scale("+sc+")":""));}
function popIn(g,p,x,y,sc){const s=(p<=0)?0:eoB(p)*(sc||1);g.setAttribute("transform","translate("+x+" "+y+") scale("+Math.max(0.0001,s)+")");g.setAttribute("opacity",p<=0?0:1);}

/* ============ MIKE rig ============ */
/* origin at feet center; height ~410 up (negative y) */
function mkMike(parent){
  const root=grp(parent);
  const flip=grp(root);           // facing: scaleX
  const body=grp(flip,"");        // bob/lean
  body.setAttribute("filter","url(#ds)");
  // legs (pivot at hips y=-165)
  function leg(x){
    const hip=grp(body); hip.setAttribute("data-piv",x+",-165");
    const inner=grp(hip);
    rect(inner,-16,0,32,120,C.denim,10);                       // thigh+shin as one, from hip down
    rect(inner,-20,112,52,26,C.black,9);                       // sneaker
    rect(inner,-20,130,52,10,C.white,4);                       // sole
    return {hip:hip,inner:inner,x:x};
  }
  const legL=leg(-24), legR=leg(24);
  // torso
  const torsoG=grp(body);
  rect(torsoG,-60,-330,120,168,C.black,20);                    // shirt
  rect(torsoG,-60,-206,120,44,C.denim,10);                     // jeans top
  rect(torsoG,-8,-322,16,110,"#3a3d45",4);                     // shirt placket
  circ(torsoG,0,-296,4,"#777c88"); circ(torsoG,0,-272,4,"#777c88"); circ(torsoG,0,-248,4,"#777c88");
  // arms (pivot shoulders)
  function arm(x){
    const sh=grp(body); const inner=grp(sh);
    rect(inner,-13,-6,26,118,C.black,12);
    circ(inner,0,116,15,C.skin);
    return {sh:sh,inner:inner,x:x};
  }
  const armL=arm(-52), armR=arm(52);
  // head group (pivot neck at 0,-330)
  const headP=grp(body); const head=grp(headP);
  rect(head,-14,-16,28,20,C.skin,6);                            // neck
  rect(head,-50,-118,100,108,C.skin,30);                        // face
  path(head,"M -50 -62 Q -52 -6 0 -2 Q 52 -6 50 -62 L 50 -46 Q 46 -18 24 -30 L -24 -30 Q -46 -18 -50 -46 Z",C.beard); // beard
  path(head,"M -24 -30 Q 0 -20 24 -30 L 24 -14 Q 0 -2 -24 -14 Z",C.beard); // beard chin
  const mouthG=grp(head);
  const mSmile=path(mouthG,"M -14 -26 Q 0 -14 14 -26","none",{stroke:"#f0d9c2","stroke-width":6,"stroke-linecap":"round"});
  const mFrown=path(mouthG,"M -13 -18 Q 0 -28 13 -18","none",{stroke:"#f0d9c2","stroke-width":6,"stroke-linecap":"round",opacity:0});
  const mO=circ(mouthG,0,-22,10,"#5a3d33",{opacity:0});
  const mFlat=line(mouthG,-12,-22,12,-22,"#f0d9c2",6,{opacity:0});
  // eyes
  const eyeG=grp(head);
  const eL=grp(eyeG),eR=grp(eyeG);
  circ(eL,-22,-72,12,C.white); const pL=circ(eL,-19,-72,5.5,"#23252b");
  circ(eR,22,-72,12,C.white);  const pR=circ(eR,25,-72,5.5,"#23252b");
  const lidL=rect(eL,-35,-86,26,14,C.skin,4,{opacity:0});
  const lidR=rect(eR,9,-86,26,14,C.skin,4,{opacity:0});
  // brows
  const brL=rect(eyeG,-34,-94,24,7,C.beard,3);
  const brR=rect(eyeG,10,-94,24,7,C.beard,3);
  // glasses
  const gl=grp(head);
  rect(gl,-38,-88,32,30,"none",9,{stroke:C.black,"stroke-width":6});
  rect(gl,6,-88,32,30,"none",9,{stroke:C.black,"stroke-width":6});
  line(gl,-6,-76,6,-76,C.black,6);
  // cap
  path(head,"M -52 -104 Q -52 -148 0 -148 Q 52 -148 52 -104 L 52 -96 L -52 -96 Z",C.black);
  path(head,"M 20 -104 L 78 -104 Q 84 -96 76 -92 L 20 -92 Z",C.black); // bill (faces +x)
  rect(head,-52,-104,104,10,"#3a3d45",4);
  const api={g:root,body:body,head:headP,armL:armL,armR:armR,legL:legL,legR:legR,_dir:1,_x:0,_y:0,_sc:1};
  function rotLimb(l,deg){l.hip?l.hip.setAttribute("transform","translate("+l.x+" -165) rotate("+deg+")"):0;}
  function rotArm(a,deg){a.sh.setAttribute("transform","translate("+a.x+" -300) rotate("+deg+")");}
  api.place=(x,y,sc,dir)=>{api._x=x;api._y=y;api._sc=sc||1;api._dir=dir||1;
    root.setAttribute("transform","translate("+x+" "+y+") scale("+api._sc+")");
    flip.setAttribute("transform","scale("+api._dir+" 1)");};
  api.legs=(a,b)=>{rotLimb(legL,a);rotLimb(legR,b);};
  api.arms=(a,b)=>{rotArm(armL,a);rotArm(armR,b);};
  api.headRot=(d,dy)=>{headP.setAttribute("transform","translate(0 "+(-330+(dy||0))+") rotate("+d+")");head.setAttribute("transform","translate(0 0)");};
  api.bob=(dy,lean)=>{body.setAttribute("transform","translate(0 "+dy+")"+(lean?" rotate("+lean+")":""));};
  api.mouth=(m)=>{mSmile.setAttribute("opacity",m==="smile"?1:0);mFrown.setAttribute("opacity",m==="frown"?1:0);mO.setAttribute("opacity",m==="o"?1:0);mFlat.setAttribute("opacity",m==="flat"?1:0);};
  api.brows=(k)=>{ // normal | up | angry | sad
    if(k==="up"){brL.setAttribute("transform","translate(0 -10)");brR.setAttribute("transform","translate(0 -10)");}
    else if(k==="angry"){brL.setAttribute("transform","rotate(14 -22 -90)");brR.setAttribute("transform","rotate(-14 22 -90)");}
    else if(k==="sad"){brL.setAttribute("transform","rotate(-12 -22 -90)");brR.setAttribute("transform","rotate(12 22 -90)");}
    else {brL.setAttribute("transform","");brR.setAttribute("transform","");}
  };
  api.lids=(on)=>{lidL.setAttribute("opacity",on?1:0);lidR.setAttribute("opacity",on?1:0);};
  api.pupils=(dx,dy)=>{pL.setAttribute("cx",-19+dx);pL.setAttribute("cy",-72+(dy||0));pR.setAttribute("cx",25+dx);pR.setAttribute("cy",-72+(dy||0));};
  api.expr=(k)=>{
    api.lids(false);
    if(k==="happy"){api.mouth("smile");api.brows("up");}
    else if(k==="worried"){api.mouth("frown");api.brows("sad");}
    else if(k==="shocked"){api.mouth("o");api.brows("up");}
    else if(k==="flat"){api.mouth("flat");api.brows("normal");}
    else if(k==="mad"){api.mouth("frown");api.brows("angry");}
    else if(k==="relieved"){api.mouth("smile");api.brows("normal");api.lids(true);}
  };
  api.run=(t)=>{const s=Math.sin(q(t,12)*Math.PI*2*2.4);
    api.legs(34*s,-34*s);api.arms(-30*s,30*s);
    api.bob(-Math.abs(s)*10,6*api._dir*0);api.headRot(4*s,2);};
  api.stand=()=>{api.legs(0,0);api.arms(6,-6);api.bob(0,0);api.headRot(0,0);};
  api.headHands=(t)=>{const j=Math.sin(q(t,6)*Math.PI*2)*2;
    api.legs(0,0);api.arms(-120+j,120-j);api.bob(6,0);api.headRot(6+j,10);};
  api.thumbs=()=>{api.legs(0,0);api.arms(8,-165);api.bob(0,0);api.headRot(-3,0);};
  api.typing=(t)=>{const j=Math.sin(q(t,10)*Math.PI*2*3)*5;api.legs(0,0);api.arms(-70+j,-70-j);api.bob(2,0);api.headRot(3,4);};
  api.facepalm=(p)=>{api.legs(0,0);api.arms(6,lerp(-6,-152,p));api.bob(2,0);api.headRot(lerp(0,9,p),lerp(0,8,p));};
  api.recline=()=>{api.bob(0,-12);api.legs(-128,-136);api.arms(-20,-108);api.headRot(-6,0);};
  api.stand();api.expr("flat");
  return api;
}

/* ============ ROBOT rig ============ */
/* origin at feet; height ~265 */
function mkBot(parent,opts){
  opts=opts||{};
  const root=grp(parent); const body=grp(root); body.setAttribute("filter","url(#ds)");
  rect(body,-24,-38,18,30,"#c9c2ad",6); rect(body,6,-38,18,30,"#c9c2ad",6); // legs
  rect(body,-30,-12,26,14,"#8f8873",5); rect(body,4,-12,26,14,"#8f8873",5); // feet
  rect(body,-58,-172,116,140,C.bot,26,{stroke:C.botEdge,"stroke-width":4});  // torso
  poly(body,"0,-172 14,-150 0,-108 -14,-150",C.tie);                          // tie
  circ(body,-40,-64,5,"#b9b09a"); circ(body,-24,-64,5,"#b9b09a");
  function bArm(x){const sh=grp(body);const inner=grp(sh);
    rect(inner,-9,-4,18,64,"#d9d2bd",9,{stroke:C.botEdge,"stroke-width":3});
    circ(inner,0,66,12,"#c9c2ad");return {sh:sh,inner:inner,x:x};}
  const aL=bArm(-58),aR=bArm(58);
  const headP=grp(body);headP.setAttribute("transform","translate(0 -160)");
  const head=grp(headP);
  rect(head,-10,-10,20,12,"#c9c2ad",4);
  rect(head,-52,-104,104,96,C.bot,24,{stroke:C.botEdge,"stroke-width":4});
  rect(head,-38,-88,76,58,C.screen,12);
  line(head,0,-104,0,-122,"#c9c2ad",6); const antBall=circ(head,0,-128,8,opts.ant||C.red);
  // eyes on screen
  const eg=grp(head);
  const happyL=path(eg,"M -24 -56 Q -17 -66 -10 -56","none",{stroke:C.led,"stroke-width":6,"stroke-linecap":"round"});
  const happyR=path(eg,"M 10 -56 Q 17 -66 24 -56","none",{stroke:C.led,"stroke-width":6,"stroke-linecap":"round"});
  const dotL=circ(eg,-17,-59,7,C.led,{opacity:0}); const dotR=circ(eg,17,-59,7,C.led,{opacity:0});
  const xL=grp(eg),xR=grp(eg);
  line(xL,-23,-65,-11,-53,C.red,5);line(xL,-11,-65,-23,-53,C.red,5);
  line(xR,11,-65,23,-53,C.red,5);line(xR,23,-65,11,-53,C.red,5);
  xL.setAttribute("opacity",0);xR.setAttribute("opacity",0);
  const bars=grp(eg);[[-24,10],[-12,16],[0,22],[12,13]].forEach(function(b){rect(bars,b[0],-52-b[1],8,b[1],C.led,2);});
  bars.setAttribute("opacity",0);
  const mouthDot=rect(eg,-9,-44,18,5,C.led,2);
  // accessories
  if(opts.crown){poly(head,"-30,-104 -30,-130 -18,-114 0,-134 18,-114 30,-130 30,-104",C.yellow,{stroke:"#b5872a","stroke-width":3});}
  if(opts.glasses){rect(head,-34,-70,26,22,"none",6,{stroke:"#d8d2bd","stroke-width":5});rect(head,8,-70,26,22,"none",6,{stroke:"#d8d2bd","stroke-width":5});line(head,-8,-61,8,-61,"#d8d2bd",5);}
  if(opts.hr){rect(body,-52,-150,40,26,C.red,6);T(body,-32,-131,"HR",20,C.white,{ls:1});}
  if(opts.clip){const cb=grp(body);TR(cb,86,-120,8);rect(cb,-26,-38,52,72,"#b08a5a",6);rect(cb,-20,-30,40,58,C.white,4);rect(cb,-10,-44,20,12,"#8f8873",3);line(cb,-12,-14,12,-14,"#98a2b8",4);line(cb,-12,-2,12,-2,"#98a2b8",4);line(cb,-12,10,8,10,"#98a2b8",4);}
  const api={g:root,_x:0,_y:0,_sc:1,_dir:1};
  api.place=(x,y,sc,dir)=>{api._x=x;api._y=y;api._sc=sc||1;api._dir=dir||1;
    root.setAttribute("transform","translate("+x+" "+y+") scale("+(api._sc*api._dir)+" "+api._sc+")");};
  api.eyes=(k)=>{
    happyL.setAttribute("opacity",k==="happy"?1:0);happyR.setAttribute("opacity",k==="happy"?1:0);
    dotL.setAttribute("opacity",k==="dot"?1:0);dotR.setAttribute("opacity",k==="dot"?1:0);
    xL.setAttribute("opacity",k==="x"?1:0);xR.setAttribute("opacity",k==="x"?1:0);
    bars.setAttribute("opacity",k==="chart"?1:0);
  };
  api.bob=(t,amp)=>{const b=Math.abs(Math.sin(q(t,8)*Math.PI*2*1.6))*(amp==null?7:amp);body.setAttribute("transform","translate(0 "+(-b)+")");};
  api.tilt=(d)=>{body.setAttribute("transform","rotate("+d+")");};
  api.arms=(l,r)=>{aL.sh.setAttribute("transform","translate(-58 -150) rotate("+l+")");aR.sh.setAttribute("transform","translate(58 -150) rotate("+r+")");};
  api.wave=(t)=>{api.arms(8,-140+Math.sin(q(t,8)*Math.PI*2*2)*24);};
  api.point=()=>{api.arms(8,-95);};
  api.type=(t)=>{const j=Math.sin(q(t,10)*Math.PI*2*3)*6;api.arms(-60+j,-60-j);};
  api.hop=(t,speed)=>{const s=Math.abs(Math.sin(q(t,10)*Math.PI*2*(speed||2)));body.setAttribute("transform","translate(0 "+(-s*16)+")");api.arms(20-s*40,-20+s*40);};
  api.headTilt=(d)=>{headP.setAttribute("transform","translate(0 -160) rotate("+d+")");};
  api.eyes("happy");api.arms(6,-6);
  return api;
}

/* ============ props ============ */
function mkDesk(p,x,y,w){const g=grp(p);TR(g,x,y);g.setAttribute("filter","url(#ds)");
  rect(g,-w/2,0,w,34,C.deskTop,10,{stroke:"rgba(30,20,5,.2)","stroke-width":3});
  rect(g,-w/2+18,34,26,120,C.desk,6); rect(g,w/2-44,34,26,120,C.desk,6);
  return g;}
function mkMonitor(p,x,y,sc){const g=grp(p);TR(g,x,y,0,sc||1);g.setAttribute("filter","url(#ds)");
  rect(g,-110,-160,220,150,C.black,14);
  const scr=rect(g,-98,-148,196,126,C.screen,8);
  rect(g,-16,-10,32,26,C.black,4); rect(g,-52,16,104,14,"#3a3d45",6);
  const inner=grp(g); return {g:g,scr:scr,inner:inner};}
function mkPaperStack(p,x,y,n,w){const g=grp(p);TR(g,x,y);g.setAttribute("filter","url(#ds)");
  for(let i=0;i<n;i++){const j=(i*37)%9-4;rect(g,-w/2+j,-i*13,w,12,i%3?C.white:"#efe6cf",3,{stroke:"rgba(30,20,5,.14)","stroke-width":2,transform:"rotate("+(((i*53)%7)-3)+" 0 "+(-i*13)+")"});}
  return g;}
function mkSticky(p,x,y,w,h,col,rot){const g=grp(p);TR(g,x,y,rot||0);g.setAttribute("filter","url(#ds)");
  rect(g,-w/2,-h/2,w,h,col,4);return g;}
function mkBubble(p,x,y,w,h,tailx){const g=grp(p);TR(g,x,y);g.setAttribute("filter","url(#ds)");
  rect(g,-w/2,-h/2,w,h,C.white,18,{stroke:"rgba(30,20,5,.18)","stroke-width":3});
  poly(g,(tailx-16)+","+(h/2-2)+" "+(tailx+16)+","+(h/2-2)+" "+tailx+","+(h/2+26),C.white,{stroke:"rgba(30,20,5,.18)","stroke-width":3});
  rect(g,-w/2+3,-h/2+3,w-6,h/2,C.white,14); // clean tail seam
  return g;}
function mkPlant(p,x,y){const g=grp(p);TR(g,x,y);g.setAttribute("filter","url(#ds)");
  rect(g,-26,-6,52,44,"#b3562f",8);
  path(g,"M 0 -6 Q -34 -48 -16 -86 Q -4 -50 0 -6","#5cab6b");
  path(g,"M 0 -6 Q 34 -48 16 -86 Q 4 -50 0 -6","#4f9c5e");
  path(g,"M 0 -8 Q 0 -70 0 -96 L 6 -96 Q 8 -60 4 -8 Z","#417f4e");
  return g;}
function mkWindow(p,x,y,w,h,night){const g=grp(p);TR(g,x,y);g.setAttribute("filter","url(#ds)");
  rect(g,-w/2,-h/2,w,h,night?"#28405f":"#bfe0ea",10,{stroke:C.cream,"stroke-width":14});
  line(g,0,-h/2,0,h/2,C.cream,10); line(g,-w/2,0,w/2,0,C.cream,10);
  if(!night){circ(g,w/4,-h/4,26,C.yellow);path(g,"M "+(-w/2+18)+" "+(h/4)+" q 20 -18 40 0 q 20 -18 40 0 l 0 12 l -80 0 Z","#e9f4f7");}
  else{circ(g,w/4,-h/4,20,"#e9e2c8");circ(g,w/4+8,-h/4-6,16,night?"#28405f":"#fff");}
  return g;}
function mkChartPoster(p,x,y,sc){const g=grp(p);TR(g,x,y,0,sc||1);g.setAttribute("filter","url(#ds)");
  rect(g,-90,-110,180,220,C.cream,8,{stroke:"rgba(30,20,5,.2)","stroke-width":3});
  line(g,-62,78,-62,-70,C.navy,6);line(g,-62,78,66,78,C.navy,6);
  const ln=path(g,"M -56 60 L -20 30 L 8 44 L 60 -52","none",{stroke:C.green,"stroke-width":9,"stroke-linecap":"round","stroke-linejoin":"round"});
  poly(g,"60,-52 38,-48 52,-30",C.green);

const capG=grp(overlay); capG.setAttribute("filter","url(#dsBig)");
const capRect=rect(capG,0,0,10,10,C.cream,12,{stroke:"rgba(30,20,5,.2)","stroke-width":3});
const capText1=T(capG,540,0,"",40,C.navy,{ls:2});

function caption(lines,p){
  if(!lines||p<=0){capG.setAttribute("opacity",0);return;}
  const inP=eo(clamp(p/0.12,0,1));
  const outP=1-eo(clamp((p-0.9)/0.1,0,1));
  const op=Math.min(inP,outP);
  capG.setAttribute("opacity",op);
  const two=lines.length>1;
  const w=Math.max(...lines.map(s=>s.length))*24+90;
  const h=two?150:96;
  const y=1600+(1-inP)*46;
  capRect.setAttribute("x",540-w/2);capRect.setAttribute("y",y-h/2);
  capRect.setAttribute("width",w);capRect.setAttribute("height",h);
  capG.setAttribute("transform","rotate(-1.2 540 "+y+")");
  capText1.textContent=lines[0]||"";capText2.textContent=lines[1]||"";
  capText1.setAttribute("y",two?y-16:y+14);capText2.setAttribute("y",y+42);
  capText1.setAttribute("opacity",1);capText2.setAttribute("opacity",two?1:0);
}

/* ============ build & seek ============ */
let TOTAL=0;
SHOTS.forEach(function(sh){
  sh.g=grp(world);sh.s={};
  sh.build(sh.g,sh.s);
  sh.g.setAttribute("display","none");
  sh.t0=TOTAL;TOTAL+=sh.d;
});
window.TOTAL_DURATION=TOTAL;
window.SEEK=function(t){
  t=clamp(t,0,TOTAL-0.001);
  let idx=SHOTS.length-1;
  for(let i=0;i<SHOTS.length;i++){if(t<SHOTS[i].t0+SHOTS[i].d){idx=i;break;}}
  SHOTS.forEach(function(sh,i){sh.g.setAttribute("display",i===idx?"":"none");});
  if(SHOTS[0].s.title)SHOTS[0].s.title.setAttribute("opacity",idx===0?1:0);
  const sh=SHOTS[idx];
  const lt=t-sh.t0, p=lt/sh.d;
  const cam=sh.s.update(lt,p)||{z:1,x:0,y:0};
  const z=cam.z||1, cx=540+(cam.x||0), cy=960+(cam.y||0);
  world.setAttribute("transform",
    "translate(540 960)"+(cam.rot?" rotate("+cam.rot+")":"")+" scale("+z+") translate("+(-cx)+" "+(-cy)+")");
  return idx;
};
window.SEEK(0);
window.READY=true;
